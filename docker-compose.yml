services:
  mongo:
    image: mongo:8.0
    container_name: raksa-id-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - raksa-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  raksa-mongo-data:
